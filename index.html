<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mauricio Ragebait</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <section class="hero">
            <div class="character-card">
                <div class="avatar">M</div>
                <div class="character-info">
                    <h1>Mauricio</h1>
                    <p>Päähenkilö, joka yrittää pysyä rauhallisena.</p>
                </div>
            </div>

            <div class="dialogue-panel">
                <div class="comment-bubble computer">
                    <p>Tietokone: "Miksi et tee sitä nyt heti?"</p>
                </div>
                <div class="comment-bubble mauricio">
                    <p>Mauricio: "Pysyn rauhallisena."</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
