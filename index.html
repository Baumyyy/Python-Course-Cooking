<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mauricio Ragebait</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <section class="hero">
            <div class="character-card">
                <div class="avatar">
                    <img src="maukka.jpg" alt="Mauricio" class="avatar-image">
                </div>
                <div class="character-info">
                    <h1>Mauricio</h1>
                    <p>Päähenkilö, joka yrittää pysyä rauhallisena.</p>
                </div>
            </div>

            <div class="chat-frame">
                <div class="chat-header">
                    <div>
                        <h2>Keskustelu Mauricio kanssa</h2>
                        <p>Näytä, kuinka helposti saat hänet ragebaitatuksi.</p>
                    </div>
                    <div class="calmness-display">
                        <span class="calmness-meter">Rauhallisuus: <strong id="calmness-value">100</strong></span>
                        <div class="calmness-track">
                            <div class="calmness-fill" id="calmness-fill"></div>
                        </div>
                    </div>
                </div>

                <div class="dialogue-panel" id="messages"></div>

                <form class="chat-controls" id="chat-form">
                    <input id="chat-input" type="text" placeholder="Kirjoita viesti Mauriciolle..." autocomplete="off">
                    <button type="submit">Lähetä</button>
                </form>
            </div>
        </section>
    </main>

    <script>
        const messages = document.getElementById('messages');
        const input = document.getElementById('chat-input');
        const calmnessValue = document.getElementById('calmness-value');
        const calmnessFill = document.getElementById('calmness-fill');
        let calmness = 100;

        const replyRules = [
            {
                matcher: /kiitos|hyvä|ok|okei|selvä|kiitokset/i,
                response: 'Mauricio: Kiitos! Yritän rentoutua.',
                calmChange: 10
            },
            {
                matcher: /paska|vitun|saatana|olet huono|et ole|typerä/i,
                response: 'MAURICIO SAA RAGEBAITIN! FAAH!!!',
                calmChange: -35,
                rage: true
            },
            {
                matcher: /.*/,
                response: 'Mauricio: Huh, yritän pysyä rauhallisena.',
                calmChange: -5
            }
        ];

        const questions = [
            'Miksi et tee sitä nyt heti?',
            'Oletko taas liian hidas?',
            'Luulitko oikeasti, että se valmistuu itsestään?',
            'Mitä aiot tehdä, kun aikaa ei ole?',
            'Miksi viivyttelet aina niin paljon?'
        ];

        function addBubble(text, cls) {
            const bubble = document.createElement('div');
            bubble.className = `comment-bubble ${cls}`;
            bubble.innerHTML = `<p>${text}</p>`;
            messages.appendChild(bubble);
            messages.scrollTop = messages.scrollHeight;
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function updateCalmness(change) {
            calmness = clamp(calmness + change, 0, 120);
            calmnessValue.textContent = calmness;
            calmnessFill.style.width = `${(calmness / 120) * 100}%`;
            calmnessFill.style.background = `linear-gradient(90deg, #7fed72 ${calmness}%, #ff7a7a)`;

            if (calmness <= 30) {
                calmnessFill.classList.add('low');
            } else {
                calmnessFill.classList.remove('low');
            }
        }

        function getResponse(message) {
            return replyRules.find(rule => rule.matcher.test(message));
        }

        function addComputerMessage(text) {
            addBubble(`Tietokone: "${text}"`, 'computer');
        }

        function nextQuestion() {
            const next = questions[Math.floor(Math.random() * questions.length)];
            addComputerMessage(next);
        }

        document.getElementById('chat-form').addEventListener('submit', event => {
            event.preventDefault();
            const text = input.value.trim();
            if (!text || calmness === 0) return;

            addBubble(`Sinä: ${text}`, 'computer');
            const rule = getResponse(text);
            updateCalmness(rule.calmChange);

            setTimeout(() => {
                addBubble(rule.response, rule.rage ? 'mauricio rage' : 'mauricio');
                if (calmness === 0) {
                    addBubble('this is fine...', 'computer');
                    input.disabled = true;
                } else {
                    nextQuestion();
                }
            }, 300);

            input.value = '';
            input.focus();
        });

        document.addEventListener('DOMContentLoaded', () => {
            const initial = questions[Math.floor(Math.random() * questions.length)];
            addComputerMessage(initial);
            updateCalmness(0);
            input.focus();
        });
    </script>
</body>
</html>
