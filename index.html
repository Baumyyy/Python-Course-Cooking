<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mauricio Ragebait</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <section class="hero">
            <div class="character-card">
                <div class="avatar">
                    <img src="maukka.jpg" alt="Mauricio" class="avatar-image">
                </div>
                <div class="character-info">
                    <h1>Mauricio</h1>
                    <p>Päähenkilö, joka yrittää pysyä rauhallisena.</p>
                </div>
            </div>

            <div class="chat-frame">
                <div class="chat-header">
                    <div>
                        <h2>Sinä vs Mauricio</h2>
                        <p>Kirjoita viesti Mauriciolle ja yritä saada hänet ragebaitattua.</p>
                    </div>
                    <div class="calmness-display">
                        <span class="calmness-meter">Rauhallisuus: <strong id="calmness-value">100</strong></span>
                        <div class="calmness-track">
                            <div class="calmness-fill" id="calmness-fill"></div>
                        </div>
                    </div>
                </div>

                <div class="dialogue-panel" id="messages"></div>

                <form class="chat-controls" id="chat-form">
                    <input id="chat-input" type="text" placeholder="Kirjoita viesti Mauriciolle..." autocomplete="off">
                    <button type="submit">Lähetä</button>
                </form>
            </div>
        </section>
    </main>

    <script>
        const messages = document.getElementById('messages');
        const input = document.getElementById('chat-input');
        const calmnessValue = document.getElementById('calmness-value');
        const calmnessFill = document.getElementById('calmness-fill');
        let calmness = 100;

        function addBubble(text, cls) {
            const bubble = document.createElement('div');
            bubble.className = `comment-bubble ${cls}`;
            bubble.innerHTML = `<p>${text}</p>`;
            messages.appendChild(bubble);
            messages.scrollTop = messages.scrollHeight;
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function updateCalmness(change) {
            calmness = clamp(calmness + change, 0, 120);
            calmnessValue.textContent = calmness;
            calmnessFill.style.width = `${(calmness / 120) * 100}%`;
            calmnessFill.style.background = `linear-gradient(90deg, #7fed72 ${calmness}%, #ff7a7a)`;

            if (calmness <= 30) {
                calmnessFill.classList.add('low');
            } else {
                calmnessFill.classList.remove('low');
            }
        }

        async function sendMessage(message) {
            const response = await fetch('/api/reply', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message, calmness })
            });

            if (!response.ok) {
                const error = await response.json();
                addBubble(`Virhe: ${error.error || 'Palvelin ei vastannut'}`, 'user');
                return null;
            }

            return response.json();
        }

        document.getElementById('chat-form').addEventListener('submit', async event => {
            event.preventDefault();
            const text = input.value.trim();
            if (!text || calmness === 0) return;

            addBubble(`Sinä: ${text}`, 'user');
            input.value = '';
            input.disabled = true;

            const result = await sendMessage(text);
            if (!result) {
                input.disabled = false;
                input.focus();
                return;
            }

            updateCalmness(result.calmChange);
            addBubble(result.reply, result.rage ? 'mauricio rage' : 'mauricio');

            if (result.gameOver) {
                addBubble('Peli ohi. Mauricio on täysin ragebaitattu.', 'mauricio');
                input.disabled = true;
            } else {
                input.disabled = false;
                input.focus();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            addBubble('Mauricio: Kirjoita provosoiva viesti ja katso, kuinka lähelle ragebaittia pääset.', 'mauricio');
            updateCalmness(0);
            input.focus();
        });
    </script>
</body>
</html>
